spring.application.name=concesionario

# --- Base de datos (MySQL/MariaDB de XAMPP). Se puede sobrescribir con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/concesionario?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# --- Flyway: crea y versiona el esquema (src/main/resources/db/migration)
spring.flyway.enabled=true

# --- Vistas JSP (las usan los resultados de Struts)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
# Recompilar las JSP al modificarlas (Spring Boot lo trae desactivado). En producción iría a false.
server.servlet.jsp.init-parameters.development=true

# --- Fotos de coches/marcas/perfiles (carpeta fuera del WAR)
concesionario.fotos.directorio=${FOTOS_DIR:datos/fotos}

server.servlet.session.timeout=30m
server.error.include-message=never
